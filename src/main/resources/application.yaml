spring:
  application:
    name: f1_rest_api

  datasource:
    url: jdbc:postgresql://localhost:5433/f1_paddock
    username: f1_admin
    password: f1_secure_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method