services:
  postgres:
    image: postgres:16-alpine
    container_name: f1_postgres_db
    environment:
      POSTGRES_DB: f1_paddock
      POSTGRES_USER: f1_admin
      POSTGRES_PASSWORD: f1_secure_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: